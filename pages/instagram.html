<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram • Exploratores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">Instagram Tools</h1>

    <div class="columns">
        <div class="column">
            <section id="section-instagram-user" class="search-instructions">
                <h2>User Profile & Account Information</h2>
                <label for="input-instagram-username">Instagram Username:</label>
                <div class="input-container">
                    <input type="text" id="input-instagram-username" class="input-field" placeholder="Enter Username" autocomplete="off">
                </div>
                <div id="feedback-instagram-username" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-instagram-profile" class="button" data-search-id="instagram-profile">Profile</button>
                    <button id="btn-instagram-channel" class="button" data-search-id="instagram-channel">Channel</button>
                    <button id="btn-instagram-tagged" class="button" data-search-id="instagram-tagged">Tagged</button>
                </div>
            </section>

            <section id="section-instagram-external" class="search-instructions">
                <h3>External & Cross-Platform</h3>
                <div class="button-grid">
                    <button id="btn-instagram-threads" class="button" data-search-id="instagram-threads">Threads Profile</button>
                    <button id="btn-instagram-google-outgoing" class="button" data-search-id="instagram-google-outgoing">Google: Outgoing Mentions</button>
                    <button id="btn-instagram-google-incoming" class="button" data-search-id="instagram-google-incoming">Google: Incoming Mentions</button>
                    <button id="btn-instagram-bing-search" class="button" data-search-id="instagram-bing-search">Bing Search</button>
                    <button id="btn-instagram-yandex-search" class="button" data-search-id="instagram-yandex-search">Yandex Search</button>
                    <button id="btn-instagram-x-posts" class="button" data-search-id="instagram-x-posts">X/Twitter Posts</button>
                    <button id="btn-instagram-dumpor-profile" class="button" data-search-id="instagram-dumpor-profile">Dumpor Profile</button>
                    <button id="btn-instagram-toolzu-profile" class="button" data-search-id="instagram-toolzu-profile">Toolzu Profile</button>
                </div>
            </section>

            <section id="section-instagram-graphql" class="search-instructions">
                <h2>GraphQL Queries (User ID)</h2>
                <label for="input-instagram-userid">Instagram User ID:</label>
                <div class="input-container">
                    <input type="text" id="input-instagram-userid" class="input-field" placeholder="Enter numeric Instagram User ID" autocomplete="off">
                </div>
                <div id="feedback-instagram-userid" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-instagram-gql-followers" class="button" data-search-id="instagram-gql-followers">Followers</button>
                    <button id="btn-instagram-gql-following" class="button" data-search-id="instagram-gql-following">Following</button>
                </div>
            </section>
        </div>

        <div class="column">
            <section id="section-instagram-combined" class="search-instructions">
                <h2>Multi-Parameter Searches</h2>
                <label for="input-instagram-combo-usera">Username:</label>
                <div class="input-container">
                    <input type="text" id="input-instagram-combo-usera" class="input-field" placeholder="Username" autocomplete="off">
                </div>
                <label for="input-instagram-combo-userb">Keyword or Second Username:</label>
                <div class="input-container">
                    <input type="text" id="input-instagram-combo-userb" class="input-field" placeholder="Keyword or second username" autocomplete="off">
                </div>
                <div id="feedback-instagram-combined" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-instagram-combo-user-term" class="button" data-search-id="instagram-combo-user-term">User + Term (Google)</button>
                    <button id="btn-instagram-combo-associations" class="button" data-search-id="instagram-combo-associations">Associations (Google)</button>
                </div>
            </section>

            <section id="section-instagram-hashtag" class="search-instructions">
                <h2>Hashtag Searches</h2>
                <label for="input-instagram-hashtag">Hashtag or General Term:</label>
                <div class="input-container">
                    <input type="text" id="input-instagram-hashtag" class="input-field" placeholder="Hashtag (no #) or Term" autocomplete="off">
                </div>
                <div id="feedback-instagram-hashtag" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-instagram-hashtag-search" class="button" data-search-id="instagram-hashtag-search">Instagram Hashtag</button>
                    <button id="btn-instagram-term-google" class="button" data-search-id="instagram-term-google">Instagram Terms (Google)</button>
                    <button id="btn-instagram-dumpor-tag" class="button" data-search-id="instagram-dumpor-tag">Dumpor Tag</button>
                </div>
            </section>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 3.2.0 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['input-instagram-username'],
                buttonSelector: '#section-instagram-user .button, #section-instagram-external .button',
                validator: ExploratoresValidators.getAndValidateInstagramUsername,
                feedbackId: 'feedback-instagram-username'
            },
            {
                inputIds: ['input-instagram-userid'],
                buttonSelector: '#section-instagram-graphql .button',
                validator: ExploratoresValidators.getAndValidateInstagramUserId,
                feedbackId: 'feedback-instagram-userid'
            },
            {
                inputIds: ['input-instagram-combo-usera', 'input-instagram-combo-userb'],
                buttonSelector: '#section-instagram-combined .button',
                validator: ExploratoresValidators.getAndValidateInstagramCombinedSearch,
                feedbackId: 'feedback-instagram-combined'
            },
            {
                inputIds: ['input-instagram-hashtag'],
                buttonSelector: '#section-instagram-hashtag .button',
                validator: ExploratoresValidators.getAndValidateInstagramHashtag,
                feedbackId: 'feedback-instagram-hashtag'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const anyInputWithValue = group.inputIds.some(id => document.getElementById(id)?.value.trim() !== '');
                if (!anyInputWithValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
