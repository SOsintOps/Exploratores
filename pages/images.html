<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images • Exploratores</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>
    
<main>
  <h1 class="page-title">Images Tool</h1>

  <div class="columns">
    <div class="column" id="left-column">
      <section id="section-images-term" class="search-instructions">
        <h2>Image Search by Keywords</h2>
        <label for="imageSearchTermsInput">Enter keywords for image search:</label>
        <div class="input-container">
          <input type="text" id="imageSearchTermsInput" class="input-field" placeholder="Keywords..." autocomplete="off"/>
        </div>
        <div id="feedback-image-term" class="feedback-message"></div>
        <div class="note">
          <strong>NOTE:</strong> These terms are queried across multiple platforms. Results open in new tabs.
        </div>
      </section>
      <div class="button-grid">
        <button type="button" class="button" data-search-id="images-term-bing">Bing Images</button>
        <button type="button" class="button" data-search-id="images-term-facebook">Facebook Images</button>
        <button type="button" class="button" data-search-id="images-term-flickr">Flickr Images</button>
        <button type="button" class="button" data-search-id="images-term-google">Google Images</button>
        <button type="button" class="button" data-search-id="images-term-instagram">Instagram Images</button>
        <button type="button" class="button" data-search-id="images-term-linkedin">LinkedIn Images</button>
        <button type="button" class="button" data-search-id="images-term-tumblr">Tumblr Images</button>
        <button type="button" class="button" data-search-id="images-term-twitter">Twitter Images</button>
        <button type="button" class="button" data-search-id="images-term-yandex">Yandex Images</button>
      </div>
    </div>

    <div class="column" id="right-column">
      <section id="section-images-reverse" class="search-instructions">
        <h2>Reverse Image Search by URL</h2>
        <label for="reverseImageUrlInput">Paste the direct URL of an image:</label>
        <div class="input-container">
          <input type="text" id="reverseImageUrlInput" class="input-field" placeholder="Image URL (e.g., https://.../image.jpg)" autocomplete="off" />
        </div>
        <div id="feedback-image-url" class="feedback-message"></div>
        <div class="note">
          <strong>NOTE:</strong> Ensure the URL is a direct link to the image file. Results will open in new tabs.
        </div>
      </section>
      <div class="button-grid">
        <button type="button" class="button" data-search-id="images-reverse-bing">Bing</button>
        <button type="button" class="button" data-search-id="images-reverse-facecheck">FaceCheck</button>
        <button type="button" class="button" data-search-id="images-reverse-google">Google Images</button>
        <button type="button" class="button" data-search-id="images-reverse-lens">Google Lens</button>
        <button type="button" class="button" data-search-id="images-reverse-repostsleuth">Repost Sleuth</button>
        <button type="button" class="button" data-search-id="images-reverse-tineye">TinEye</button>
        <button type="button" class="button" data-search-id="images-reverse-yandex">Yandex</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>Exploratores 3.0β <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['imageSearchTermsInput'],
                buttonSelector: '#left-column .button-grid .button',
                validator: ExploratoresValidators.getAndValidateImageTerm,
                feedbackId: 'feedback-image-term'
            },
            {
                inputIds: ['reverseImageUrlInput'],
                buttonSelector: '#right-column .button-grid .button',
                validator: ExploratoresValidators.getAndValidateImageUrl,
                feedbackId: 'feedback-image-url'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const inputValue = document.getElementById(group.inputIds[0])?.value.trim();
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
