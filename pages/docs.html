<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents • Exploratores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">Documents Tool</h1>

    <div class="search-instructions">
        <label for="input-docs-term">Enter search terms:</label>
        <div class="input-container">
            <input type="text" id="input-docs-term" class="input-field" placeholder="Search Terms..." autocomplete="off">
        </div>
        <div id="feedback-docs-term" class="feedback-message"></div>
    </div>
    <div class="note">
        <strong>NOTE:</strong> Enter search terms, then select a search type below.
    </div>

    <div class="columns">
        <div id="column-docs-services" class="column">
            <section id="section-docs-services">
                <h2>Document Search Services</h2>
                <h3>Google</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-google-api">Google API</button>
                    <button class="button" data-search-id="docs-google-books">Google Books</button>
                    <button class="button" data-search-id="docs-google-docs">Google Docs</button>
                    <button class="button" data-search-id="docs-google-drive">Google Drive</button>
                </div>
                <h3>Others</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-other-amazon">Amazon AWS</button>
                    <button class="button" data-search-id="docs-other-archiveorg">Archive.org</button>
                    <button class="button" data-search-id="docs-other-cloudfront">Cloudfront</button>
                    <button class="button" data-search-id="docs-other-core">Core</button>
                    <button class="button" data-search-id="docs-other-grayhat">GrayHatWarfare</button>
                    <button class="button" data-search-id="docs-other-issuu">ISSUU</button>
                    <button class="button" data-search-id="docs-other-msdocs">MS Docs</button>
                    <button class="button" data-search-id="docs-other-pdfdrive">PDF Drive</button>
                    <button class="button" data-search-id="docs-other-powershow">Powershow</button>
                    <button class="button" data-search-id="docs-other-prezi">Prezi</button>
                    <button class="button" data-search-id="docs-other-refseek">Refseek</button>
                    <button class="button" data-search-id="docs-other-scribd">Scribd</button>
                    <button class="button" data-search-id="docs-other-slidebean">Slide Bean</button>
                    <button class="button" data-search-id="docs-other-slideshare">SlideShare</button>
                    <button class="button" data-search-id="docs-other-wikileaks">Wikileaks</button>
                </div>
                <h3>Dataset</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-dataset-openafrica">openAFRICA</button>
                </div>
            </section>
        </div>

        <div id="column-docs-filetypes" class="column">
            <section id="section-docs-filetypes">
                <h2>Search by Filetype (Google Dorks)</h2>
                <h3>Documents</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-filetype-doc">DOC/DOCX</button>
                    <button class="button" data-search-id="docs-filetype-odt">ODT/ODS/ODP</button>
                    <button class="button" data-search-id="docs-filetype-pdf">PDF</button>
                    <button class="button" data-search-id="docs-filetype-ppt">PPT/PPTX/KEY</button>
                    <button class="button" data-search-id="docs-filetype-txt">TXT/RTF/XML</button>
                    <button class="button" data-search-id="docs-filetype-xls">XLS/XLSX/CSV</button>
                </div>
                <h3>Multimedia</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-filetype-jpg">JPG/JPEG/PNG</button>
                    <button class="button" data-search-id="docs-filetype-mp3">MP3/WAV</button>
                    <button class="button" data-search-id="docs-filetype-mpg">MPG/MP4</button>
                </div>
                <h3>Archives</h3>
                <div class="button-grid">
                    <button class="button" data-search-id="docs-filetype-zip">ZIP/RAR/7Z</button>
                </div>
            </section>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 3.3.0 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>
<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['input-docs-term'],
                buttonSelector: '#column-docs-services .button, #column-docs-filetypes .button',
                validator: ExploratoresValidators.getAndValidateDocSearchTerm,
                feedbackId: 'feedback-docs-term'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const inputValue = document.getElementById(group.inputIds[0])?.value.trim();
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
