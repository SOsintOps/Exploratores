<main>

                    <button id="btn-communities-reddit-pullpush-desc" type="button" class="button" data-search-id="communities-reddit-pullpush-desc">PullPush Desc</button>
                </div>
                <hr>
                <label for="input-communities-redditUser">Username</label>
                <div class="input-container">
                    <input type="text" id="input-communities-redditUser" class="input-field" placeholder="Enter username..." autocomplete="off">
                </div>
                <div id="feedback-communities-redditUser" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-communities-reddit-profile" type="button" class="button" data-search-id="communities-reddit-profile">Profile</button>
                    <button id="btn-communities-reddit-submissions" type="button" class="button" data-search-id="communities-reddit-submissions">Submissions</button>
                    <button id="btn-communities-reddit-comments" type="button" class="button" data-search-id="communities-reddit-comments">Comments</button>
                    <button id="btn-communities-reddit-archive" type="button" class="button" data-search-id="communities-reddit-archive">Archive</button>
                    <button id="btn-communities-reddit-api-asc" type="button" class="button" data-search-id="communities-reddit-api-asc">API Asc</button>
                    <button id="btn-communities-reddit-api-desc" type="button" class="button" data-search-id="communities-reddit-api-desc">API Desc</button>
                </div>
            </section>

            <section id="section-communities-hackernews" class="search-instructions">
                <h2>Hacker News</h2>
                <label for="input-communities-hnTerm">Search Term</label>
                <div class="input-container">
                    <input type="text" id="input-communities-hnTerm" class="input-field" placeholder="Enter search term..." autocomplete="off">
                </div>
                <div id="feedback-communities-hnTerm" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-communities-hn-search" type="button" class="button" data-search-id="communities-hn-search">Search</button>
                    <button id="btn-communities-hn-google" type="button" class="button" data-search-id="communities-hn-google">Google Site</button>

                <hr>
                <label for="input-communities-hnUser">Username</label>
                <div class="input-container">
                    <input type="text" id="input-communities-hnUser" class="input-field" placeholder="Enter username..." autocomplete="off">
                </div>
                <div id="feedback-communities-hnUser" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-communities-hn-profile" type="button" class="button" data-search-id="communities-hn-profile">Profile</button>
                    <button id="btn-communities-hn-submissions" type="button" class="button" data-search-id="communities-hn-submissions">Submissions</button>
                    <button id="btn-communities-hn-threads" type="button" class="button" data-search-id="communities-hn-threads">Threads</button>

                    <button id="btn-communities-discord-servers" type="button" class="button" data-search-id="communities-discord-servers">Servers</button>

</main>

<footer>
    <p>Exploratores 3.5.0 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['input-communities-redditTerm'],
                buttonSelector: '#feedback-communities-redditTerm + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateRedditTerm,
                feedbackId: 'feedback-communities-redditTerm'
            },
            {
                inputIds: ['input-communities-redditUser'],
                buttonSelector: '#feedback-communities-redditUser + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateRedditUser,
                feedbackId: 'feedback-communities-redditUser'
            },
            {
                inputIds: ['input-communities-hnTerm'],
                buttonSelector: '#feedback-communities-hnTerm + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateHnTerm,
                feedbackId: 'feedback-communities-hnTerm'
            },
            {
                inputIds: ['input-communities-hnUser'],
                buttonSelector: '#feedback-communities-hnUser + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateHnUser,
                feedbackId: 'feedback-communities-hnUser'
            },
            {
                inputIds: ['input-communities-4chanTerm'],
                buttonSelector: '#section-communities-4chan .button-grid .button',
                validator: ExploratoresValidators.getAndValidate4chanTerm,
                feedbackId: 'feedback-communities-4chanTerm'
            },
            {
                inputIds: ['input-communities-discordTerm'],
                buttonSelector: '#section-communities-discord .button-grid .button',
                validator: ExploratoresValidators.getAndValidateDiscordTerm,
                feedbackId: 'feedback-communities-discordTerm'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                feedbackEl.textContent = validationResult.message || '';
                feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) {
                    inputElement.addEventListener('input', () => updateUi(group));
                }
            });
            updateUi(group); // Set initial state
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
