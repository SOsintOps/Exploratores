<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberChef • Exploratores</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>
    
<main>
  <h1 class="page-title">CyberChef</h1>
  
  <div tabindex="0" id="focus-trap-start" aria-hidden="true"></div>
  
  <iframe
    id="cyberchefFrame"
    src="../tools/cc/CyberChef_v10.19.4.html"
    title="CyberChef"
    class="cyberchef-iframe"
    loading="lazy"
    sandbox="allow-scripts allow-same-origin"
    role="application"
  ></iframe>
  
  <div tabindex="0" id="focus-trap-end" aria-hidden="true"></div>
</main>

<footer>
  <p>Exploratores 2.6 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/menu/navigation.js"></script>
<script src="../assets/js/config.js"></script>
<script>
  // light mode configuration
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          document.querySelectorAll(selector).forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });

  // focus trap for iframe
  function setupFocusTrap() {
    const iframe = document.getElementById('cyberchefFrame');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const focusable = [...doc.querySelectorAll('a, button, input, textarea, select, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.hasAttribute('disabled'));
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    document.getElementById('focus-trap-start')
      .addEventListener('focus', () => last.focus());
    document.getElementById('focus-trap-end')
      .addEventListener('focus', () => first.focus());
  }

  document.getElementById('cyberchefFrame')
    .addEventListener('load', setupFocusTrap);
</script>

</body>
</html>
