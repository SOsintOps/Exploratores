<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keybase • Exploratores</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
  <h1 class="page-title">Keybase Tools</h1>
  
  <section class="search-instructions">
    <label for="keybaseQueryInput">Enter Keybase Username, Team Name, or Query:</label>
    <div class="input-container">
      <input type="text" id="keybaseQueryInput" class="input-field" placeholder="e.g., enigma, stellar.public" autocomplete="off">
    </div>
    <div id="feedback-keybase" class="feedback-message"></div>
  </section>
  
  <div class="note">
    <strong>NOTE:</strong> Enter a Keybase username, team name, or search query above. The "User Stellar Info" button opens the user's profile page, where Stellar address details may be listed.
  </div>

  <div class="columns">
    <div class="column">
      <h2>Keybase Lookups</h2>
      <div class="button-grid button-grid-3col">
        <button type="button" class="button" data-search-id="keybase-team-profile">Team Profile</button>
        <button type="button" class="button" data-search-id="keybase-user-devices">User Devices</button>
        <button type="button" class="button" data-search-id="keybase-user-graph">User Graph</button>
        <button type="button" class="button" data-search-id="keybase-user-profile">User Profile</button>
        <button type="button" class="button" data-search-id="keybase-user-sigchain">User Sigchain</button>
        <button type="button" class="button" data-search-id="keybase-user-stellar">User Stellar Info</button>
      </div>
    </div>
    <div class="column">
    </div>
  </div>
</main>

<footer>
  <p>Exploratores 3.1.5 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['keybaseQueryInput'],
                buttonSelector: '.button-grid .button',
                validator: ExploratoresValidators.getAndValidateKeybaseQuery,
                feedbackId: 'feedback-keybase'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const inputValue = document.getElementById(group.inputIds[0])?.value.trim();
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
