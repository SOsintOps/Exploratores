<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maps • Exploratores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>
    
<main>
  <h1 class="page-title">Maps Tool</h1>

  <section class="search-instructions" id="section-maps-coords">
    <div class="input-container">
      <div style="flex: 1;">
        <label for="latitudeInput">Latitude:</label>
        <input type="text" id="latitudeInput" class="input-field" placeholder="e.g., 40.7128" autocomplete="off" style="width: 100%;">
      </div>
      <div style="flex: 1;">
        <label for="longitudeInput">Longitude:</label>
        <input type="text" id="longitudeInput" class="input-field" placeholder="e.g., -74.0060" autocomplete="off" style="width: 100%;">
      </div>
    </div>
    <div id="coords-feedback" class="feedback-message"></div>
  </section>
  <div class="note"> <strong>NOTE:</strong> For coordinates, use decimal degrees. Latitude: N positive, S negative. Longitude: E positive, W negative.</div>

  <div class="columns">
    <div class="column">
      <h2>Google Maps</h2>
      <div class="button-grid" id="grid-maps-google">
        <button type="button" class="button" data-search-id="maps-google-map">Google Map</button>
        <button type="button" class="button" data-search-id="maps-google-sat">Google Sat</button>
        <button type="button" class="button" data-search-id="maps-google-street">Google Street</button>
        <button type="button" class="button" data-search-id="maps-google-street-e">Google Street (E)</button>
        <button type="button" class="button" data-search-id="maps-google-street-n">Google Street (N)</button>
        <button type="button" class="button" data-search-id="maps-google-street-s">Google Street (S)</button>
        <button type="button" class="button" data-search-id="maps-google-street-w">Google Street (W)</button>
      </div>
      
      <h2>Bing Maps</h2>
      <div class="button-grid" id="grid-maps-bing">
        <button type="button" class="button" data-search-id="maps-bing-map">Bing Map</button>
        <button type="button" class="button" data-search-id="maps-bing-sat">Bing Sat</button>
        <button type="button" class="button" data-search-id="maps-bing-sat-e">Bing Sat (E)</button>
        <button type="button" class="button" data-search-id="maps-bing-sat-n">Bing Sat (N)</button>
        <button type="button" class="button" data-search-id="maps-bing-sat-s">Bing Sat (S)</button>
        <button type="button" class="button" data-search-id="maps-bing-sat-w">Bing Sat (W)</button>
        <button type="button" class="button" data-search-id="maps-bing-street-e">Bing Street (E)</button>
        <button type="button" class="button" data-search-id="maps-bing-street-n">Bing Street (N)</button>
        <button type="button" class="button" data-search-id="maps-bing-street-s">Bing Street (S)</button>
        <button type="button" class="button" data-search-id="maps-bing-street-w">Bing Street (W)</button>
      </div>
    </div>

    <div class="column">
      <h2>Other Map Services</h2>
      <div class="button-grid" id="grid-maps-other">
        <button type="button" class="button" data-search-id="maps-apple">Apple Maps</button>
        <button type="button" class="button" data-search-id="maps-apple-alt">Apple Maps Alt</button>
        <button type="button" class="button" data-search-id="maps-here-sat">Here Sat</button>
        <button type="button" class="button" data-search-id="maps-kartaview">KartaView</button>
        <button type="button" class="button" data-search-id="maps-landviewer">Land Viewer</button>
        <button type="button" class="button" data-search-id="maps-mapillary">Mapillary</button>
        <button type="button" class="button" data-search-id="maps-world-imagery">World Imagery</button>
        <button type="button" class="button" data-search-id="maps-yandex-sat">Yandex Sat</button>
        <button type="button" class="button" data-search-id="maps-zoom-earth">Zoom Earth</button>
      </div>

      <h2>Real Estate Maps</h2>
      <div class="button-grid" id="grid-maps-realestate">
        <button type="button" class="button" data-search-id="maps-acrevalue">AcreValue</button>
        <button type="button" class="button" data-search-id="maps-realtor">Realtor</button>
        <button type="button" class="button" data-search-id="maps-trulia">Trulia</button>
        <button type="button" class="button" data-search-id="maps-zillow">Zillow</button>
      </div>
    </div>
  </div> 
  
  <hr style="margin: 2rem 0;">

  <h2>Address to Geocode</h2>
  <div class="columns">
    <div class="column">
      <h3>USA</h3>
      <section class="search-instructions" id="section-geocode-usa">
        <label for="usa_number">Number:</label>
        <div class="input-container"><input type="text" id="usa_number" class="input-field" placeholder="Nr."></div>
        <label for="usa_street">Street:</label>
        <div class="input-container"><input type="text" id="usa_street" class="input-field" placeholder="Street"></div>
        <label for="usa_city">City:</label>
        <div class="input-container"><input type="text" id="usa_city" class="input-field" placeholder="City"></div>
        <label for="usa_state">State:</label>
        <div class="input-container"><input type="text" id="usa_state" class="input-field" placeholder="State"></div>
        <label for="usa_zip">Zip Code:</label>
        <div class="input-container"><input type="text" id="usa_zip" class="input-field" placeholder="Zip"></div>
        <div id="usa-address-feedback" class="feedback-message"></div>
        <div class="button-grid" style="margin-top: 1rem;">
          <button type="button" class="button" style="width:100%;" data-search-id="maps-geocode-usa">Convert Address</button>
        </div>
      </section>
    </div>
    <div class="column">
      <h3>ITALY</h3>
      <section class="search-instructions" id="section-geocode-italy">
        <label for="italy_street">Street/Square (Via/Piazza):</label>
        <div class="input-container"><input type="text" id="italy_street" class="input-field" placeholder="Via/Piazza"></div>
        <label for="italy_number">Number (Nr.):</label>
        <div class="input-container"><input type="text" id="italy_number" class="input-field" placeholder="Nr."></div>
        <label for="italy_zip">Postal Code (CAP):</label>
        <div class="input-container"><input type="text" id="italy_zip" class="input-field" placeholder="CAP"></div>
        <label for="italy_city">City (Città):</label>
        <div class="input-container"><input type="text" id="italy_city" class="input-field" placeholder="Città"></div>
        <label for="italy_nation">Nation (Nazione):</label>
        <div class="input-container"><input type="text" id="italy_nation" class="input-field" placeholder="Nazione (e.g., Italia)"></div>
        <div id="italy-address-feedback" class="feedback-message"></div>
        <div class="button-grid" style="margin-top: 1rem;">
          <button type="button" class="button" style="width:100%;" data-search-id="maps-geocode-italy">Convert Address</button>
        </div>
      </section>
    </div>
  </div>
</main>
    
<footer>
  <p>Exploratores 3.1.6 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['latitudeInput', 'longitudeInput'],
                buttonSelector: '#grid-maps-google .button, #grid-maps-bing .button, #grid-maps-other .button, #grid-maps-realestate .button',
                validator: ExploratoresValidators.getAndValidateCoordinates,
                feedbackId: 'coords-feedback'
            },
            {
                inputIds: ['usa_number', 'usa_street', 'usa_city', 'usa_state', 'usa_zip'],
                buttonSelector: '#section-geocode-usa .button',
                validator: ExploratoresValidators.getAndValidateUsaAddress,
                feedbackId: 'usa-address-feedback'
            },
            {
                inputIds: ['italy_street', 'italy_number', 'italy_zip', 'italy_city', 'italy_nation'],
                buttonSelector: '#section-geocode-italy .button',
                validator: ExploratoresValidators.getAndValidateItalyAddress,
                feedbackId: 'italy-address-feedback'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            // Special handling for Zillow button
            if (group.validator === ExploratoresValidators.getAndValidateCoordinates) {
                const zillowButton = document.querySelector('[data-search-id="maps-zillow"]');
                const zillowValidation = ExploratoresValidators.getAndValidateZillowCoords();
                if (zillowButton) {
                    zillowButton.disabled = !zillowValidation.isValid;
                    zillowButton.classList.toggle('text-active', zillowValidation.isValid);
                }
            }

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                if (button.dataset.searchId !== 'maps-zillow') { // Avoid re-handling zillow
                    button.disabled = !validationResult.isValid;
                    button.classList.toggle('text-active', validationResult.isValid);
                }
            });

            if (feedbackEl) {
                const inputValue = group.inputIds.map(id => document.getElementById(id)?.value.trim()).join('');
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
