<script>
    // --- On-Page Tool: Unix Time Converter ---
    function setupUnixConverter() {
        const convertBtn = document.getElementById('btn-currencies-unix-convert');
        const unixInput = document.getElementById('input-currencies-unixTimestamp');
        const outputSpan = document.getElementById('span-currencies-datetime');
        const feedbackDiv = document.getElementById('feedback-currencies-unixTimestamp');

        const handleConversion = () => {
            if (!unixInput || !outputSpan || !feedbackDiv) return;
            const timestampStr = unixInput.value.trim();

            if (timestampStr === '') {
                feedbackDiv.textContent = '';
                outputSpan.textContent = '';
                return;
            }
            if (!/^\d+$/.test(timestampStr)) {
                feedbackDiv.textContent = 'Invalid format. Please enter only numbers.';
                feedbackDiv.className = 'feedback-message feedback-error';
                outputSpan.textContent = '';
                return;
            }
            const date = new Date(parseInt(timestampStr, 10) * 1000);
            if (isNaN(date.getTime())) {
                feedbackDiv.textContent = 'Invalid timestamp value.';
                feedbackDiv.className = 'feedback-message feedback-error';
                outputSpan.textContent = '';
                return;
            }
            feedbackDiv.textContent = 'Conversion successful.';
            feedbackDiv.className = 'feedback-message feedback-info';
            outputSpan.textContent = date.toUTCString();
        };

        if (convertBtn) convertBtn.addEventListener('click', handleConversion);
        if (unixInput) unixInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') handleConversion();
        });
    }

    // --- Search UI Management ---
    function setSearchUiState() {
        const inputGroups = [
            {
                inputIds: ['input-currencies-btcAddress'],
                buttonSelector: '#section-currencies-btc .button',
                validator: ExploratoresValidators.getAndValidateBtcAddress,
                feedbackId: 'feedback-currencies-btcAddress'
            },
            {
                inputIds: ['input-currencies-cryptoAmount'],
                buttonSelector: '#section-currencies-converter .button-grid:nth-of-type(1) .button',
                validator: ExploratoresValidators.getAndValidateCryptoAmount,
                feedbackId: 'feedback-currencies-cryptoAmount'
            },
            {
                inputIds: ['input-currencies-fiatAmount'],
                buttonSelector: '#section-currencies-converter .button-grid:nth-of-type(2) .button',
                validator: ExploratoresValidators.getAndValidateFiatAmount,
                feedbackId: 'feedback-currencies-fiatAmount'
            },
            {
                inputIds: ['input-currencies-otherCryptoAddress'],
                buttonSelector: '#section-currencies-othercrypto .button',
                validator: ExploratoresValidators.getAndValidateOtherCryptoAddress,
                feedbackId: 'feedback-currencies-otherCryptoAddress'
            },
            {
                inputIds: ['input-currencies-analysisQuery'],
                buttonSelector: '#section-currencies-analysis .button',
                validator: ExploratoresValidators.getAndValidateAnalysisQuery,
                feedbackId: 'feedback-currencies-analysisQuery'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const inputValue = group.inputIds.map(id => document.getElementById(id)?.value.trim()).join('');
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    // --- DOMContentLoaded Initializer ---
    document.addEventListener('DOMContentLoaded', () => {
        setupUnixConverter();
        setSearchUiState();
    });
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>
