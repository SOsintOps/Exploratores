<script>
  function updatePageState() {
    // Group 1: Officer Name
    const officerNameValid = ExploratoresValidators.getAndValidateOfficerName();
    document.querySelectorAll('#grid-pcr-officers .button').forEach(button => {
        const config = SearchLibrary[button.dataset.searchId] || {};
        const isEnabled = officerNameValid || config.no_input;
        button.disabled = !isEnabled;
        button.classList.toggle('text-active', isEnabled);
    });

    // Group 2: US Officer Name
    const usOfficerNameValid = ExploratoresValidators.getAndValidateUsOfficerName();
    document.querySelectorAll('#grid-pcr-usofficers .button').forEach(button => {
        button.disabled = !usOfficerNameValid;
        button.classList.toggle('text-active', !!usOfficerNameValid);
    });

    // Group 3: Company Name
    const companyNameValid = ExploratoresValidators.getAndValidateCompanyName();
    document.querySelectorAll('#grid-pcr-companies .button').forEach(button => {
        const config = SearchLibrary[button.dataset.searchId] || {};
        const isEnabled = companyNameValid || config.no_input;
        button.disabled = !isEnabled;
        button.classList.toggle('text-active', isEnabled);
    });

    // Group 4: Company Email
    const companyEmailValid = ExploratoresValidators.getAndValidateCompanyEmail();
    document.querySelectorAll('#grid-pcr-contact-email .button').forEach(button => {
        button.disabled = !companyEmailValid;
        button.classList.toggle('text-active', !!companyEmailValid);
    });

    // Group 5: Company Phone
    const companyPhoneValid = ExploratoresValidators.getAndValidateCompanyPhone();
    document.querySelectorAll('#grid-pcr-contact-phone .button').forEach(button => {
        button.disabled = !companyPhoneValid;
        button.classList.toggle('text-active', !!companyPhoneValid);
    });
    
    // Group 6: SSDI
    const ssnValid = ExploratoresValidators.getAndValidateSsn();
    document.querySelectorAll('#grid-pcr-ssdi .button').forEach(button => {
        button.disabled = !ssnValid;
        button.classList.toggle('text-active', !!ssnValid);
    });
  }

  function setInitialPageState() {
    const inputs = [
        'officerNameInput', 'officerSearchFirstName', 'officerSearchLastName',
        'companyNameInput', 'companyEmailInput', 'companyPhoneInput', 'ssnInput'
    ];
    inputs.forEach(id => {
        const inputElement = document.getElementById(id);
        if (inputElement) {
            inputElement.addEventListener('input', updatePageState);
        }
    });
    updatePageState();
  }

  document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>
