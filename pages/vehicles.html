<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicles • Exploratores</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">Vehicles Tool</h1>
    <div class="note">
      <strong>NOTE:</strong> Enter the VIN or licence plate data below. Search buttons activate when valid data is provided.
    </div>
    <div class="columns">
      <div class="column">
        <section class="form-section" id="section-vehicles-vin">
          <h2>VIN Finder</h2>
          <div class="input-container">
            <input type="text" id="vinValue" class="input-field" placeholder="VIN (17 chars)" autocomplete="off" />
          </div>
          <div id="vin-feedback" class="feedback-message"></div><br>
          <div class="button-grid">
            <button id="btn-vehicles-vindecoderz" class="button" data-search-id="vehicles-vindecoderz">VINDecoderz</button>
            <button id="btn-vehicles-faxvin" class="button" data-search-id="vehicles-faxvin">FaxVIN</button>
            <button id="btn-vehicles-checkthatvin" class="button" data-search-id="vehicles-checkthatvin">CheckThatVIN</button>
            <button id="btn-vehicles-vincheckinfo" class="button" data-search-id="vehicles-vincheckinfo">VINCheck.info</button>
            <button id="btn-vehicles-searchquarry-vin" class="button" data-search-id="vehicles-searchquarry-vin">SearchQuarry</button>
            <button id="btn-vehicles-cyclevin" class="button" data-search-id="vehicles-cyclevin">CycleVIN</button>
            <button id="btn-vehicles-recordfinder-vin" class="button" data-search-id="vehicles-recordfinder-vin">RecordFinder</button>
            <button id="btn-vehicles-canadavin" class="button" data-search-id="vehicles-canadavin">CanadaVIN</button>
          </div>
        </section>
      </div>

      <div class="column">
        <section class="form-section" id="section-vehicles-plate">
          <h2>License Plates (USA)</h2>
          <div class="input-container">
            <input type="text" id="lpNumber" class="input-field" placeholder="License Plate" autocomplete="off" />
            <input type="text" id="lpState"  class="input-field" placeholder="2-Letter State" autocomplete="off" />
          </div>
          <div id="plate-feedback" class="feedback-message"></div>
          <div class="button-grid">
            <button id="btn-vehicles-carvana" class="button" data-search-id="vehicles-carvana">Carvana</button>
            <button id="btn-vehicles-searchquarry-plate" class="button" data-search-id="vehicles-searchquarry-plate">SearchQuarry</button>
            <button id="btn-vehicles-recordfinder-plate" class="button" data-search-id="vehicles-recordfinder-plate">RecordFinder</button>
            <button id="btn-vehicles-infotracer-plate" class="button" data-search-id="vehicles-infotracer-plate">InfoTracer</button>
          </div>
        </section>

        <section class="form-section" id="section-vehicles-identifier" style="margin-top: 2rem;">
          <h2>Vehicle Identifier</h2>
          <h3>Visual Identification</h3>
          <p class="input-section-description">(via Carnet.ai)</p>
          <button id="btn-vehicles-carnetai" class="button" style="width:100%; max-width:280px;" data-search-id="vehicles-carnetai">
            Launch Carnet.ai
          </button>
        </section>
      </div>
    </div>
</main>

<footer>
    <p>Exploratores 3.1.6 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['vinValue'],
                buttonSelector: '#section-vehicles-vin .button',
                validator: ExploratoresValidators.getAndValidateVin,
                feedbackId: 'vin-feedback'
            },
            {
                inputIds: ['lpNumber', 'lpState'],
                buttonSelector: '#section-vehicles-plate .button',
                validator: ExploratoresValidators.getAndValidatePlate,
                feedbackId: 'plate-feedback'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const inputValue = group.inputIds.map(id => document.getElementById(id)?.value.trim()).join('');
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) {
                    inputElement.addEventListener('input', () => updateUi(group));
                }
            });
            updateUi(group); // Set initial state
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
