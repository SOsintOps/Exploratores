<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBAN • Exploratores</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">IBAN Verification & Parsing Tool</h1>
    <section class="search-instructions">
        <label for="ibanInput">Enter IBAN to verify:</label>
        <div class="input-button-line">
            <input type="text" id="ibanInput" class="input-field" placeholder="e.g., IT60X054281110100000123456" autocomplete="off">
            <button type="button" id="verifyButton" class="button">Verify</button>
        </div>
        <div id="feedbackMessage" class="feedback-message"></div>
    </section>
    <div class="note">
        <strong>NOTE:</strong> This tool validates IBAN structure for multiple countries and identifies the bank for Italian IBANs. No data is sent to external services.
    </div>

    <div id="resultContainer" style="display: none;">
        <h2>Verification Results</h2>
        <div class="columns">
            <div class="column">
                <h3>IBAN Information</h3>
                <div id="ibanInfo"></div>
            </div>
            <div class="column">
                <h3>Bank Information</h3>
                <div id="bankInfo"></div>
            </div>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 2.5 • Prototype <a href="../license.html">License</a></p>
</footer>

<script src="../assets/menu/navigation.js"></script>
<script src="../assets/js/config.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ibanInput = document.getElementById('ibanInput');
    const verifyButton = document.getElementById('verifyButton');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const resultContainer = document.getElementById('resultContainer');
    const ibanInfo = document.getElementById('ibanInfo');
    const bankInfo = document.getElementById('bankInfo');

    const validateIbanChecksum = (iban) => {
        const rearranged = iban.slice(4) + iban.slice(0, 4);
        let numericString = '';
        for (let char of rearranged) {
            if (/[A-Z]/.test(char)) {
                numericString += (char.charCodeAt(0) - 55);
            } else {
                numericString += char;
            }
        }
        return BigInt(numericString) % 97n === 1n;
    };

    const checkIban = () => {
        const iban = ibanInput.value.replace(/\s/g, '').toUpperCase();
        
        hideResults();
        if (!iban) {
            showFeedback('Please enter an IBAN.', 'error');
            return;
        }

        const countryCode = iban.slice(0, 2);
        const registry = (typeof ibanRegistry !== 'undefined') ? ibanRegistry[countryCode] : undefined;

        if (!registry) {
            showFeedback('Invalid or unsupported country code.', 'error');
            return;
        }
        if (iban.length !== registry.length) {
            showFeedback(`Invalid length for ${registry.name}. Expected ${registry.length} chars.`, 'error');
            return;
        }
        if (!validateIbanChecksum(iban)) {
            showFeedback('IBAN is not valid (checksum failed).', 'error');
            return;
        }

        showFeedback('IBAN is valid.', 'info');
        showResults(iban, registry);
    };

    const showFeedback = (message, type) => {
        feedbackMessage.textContent = message;
        feedbackMessage.className = `feedback-message feedback-${type}`;
    };

    const hideResults = () => {
        resultContainer.style.display = 'none';
        ibanInfo.innerHTML = '';
        bankInfo.innerHTML = '';
    };

    const showResults = (iban, registry) => {
        const bban = iban.slice(4);
        const [start, end] = registry.bankIdPos.split('-').map(Number);
        const bankId = bban.slice(start - 1, end);
        let bankName = 'Bank name lookup only for Italian IBANs.';

        if (registry.name === 'Italy' && typeof bankDatabase !== 'undefined') {
            bankName = bankDatabase[bankId] || 'Italian bank not identified in this list.';
        }
        
        ibanInfo.innerHTML = `
            <p><strong>Country:</strong> ${registry.name} (${iban.slice(0, 2)})</p>
            <p><strong>Check Digits:</strong> ${iban.slice(2, 4)}</p>
            <p><strong>Length:</strong> ${iban.length} characters</p>
        `;
        bankInfo.innerHTML = `
            <p><strong>Bank Identifier:</strong> ${bankId}</p>
            <p><strong>Bank Name:</strong> ${bankName}</p>
        `;
        resultContainer.style.display = 'block';
    };

    verifyButton.addEventListener('click', checkIban);
    ibanInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkIban();
    });
    ibanInput.addEventListener('input', () => {
        hideResults();
        showFeedback('', 'info');
    });

    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          document.querySelectorAll(selector).forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
});
</script>

</body>
</html>
