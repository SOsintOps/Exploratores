    <h1 class="page-title">IBAN Verification Tool</h1>
    <section class="search-instructions">
        <label for="ibanInput">Enter IBAN to verify:</label>
        <div class="input-button-line">
            <input type="text" id="ibanInput" class="input-field" placeholder="e.g., IT60X054281110100000123456" autocomplete="off">

        </div>
        <div id="feedbackMessage" class="feedback-message"></div>
    </section>
    <div class="note">
        <strong>NOTE:</strong> This tool validates the IBAN's structure and checksum, and identifies the bank for Italian IBANs. No data is sent to external services.
    </div>

    <div id="resultContainer" style="display: none;">

            </div>
            <div class="column">

                <div id="bankInfo"></div>
            </div>
        </div>
    </div>
</main>

    const ibanInput = document.getElementById('ibanInput');
    const verifyButton = document.getElementById('verifyButton');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const resultContainer = document.getElementById('resultContainer');
    const ibanInfo = document.getElementById('ibanInfo');
    const bankInfo = document.getElementById('bankInfo');

    const validateIbanChecksum = (iban) => {
        const rearranged = iban.slice(4) + iban.slice(0, 4);
        let numericString = '';
        for (let char of rearranged) {
            if (/[A-Z]/.test(char)) {
                numericString += (char.charCodeAt(0) - 55);
            } else {
                numericString += char;
            }
        }
        return BigInt(numericString) % 97n === 1n;
    };

    const checkIban = () => {
        const iban = ibanInput.value.replace(/\s/g, '').toUpperCase();
        
        hideResults();
        if (!iban) {
            showFeedback('Please enter an IBAN.', 'error');
            return;
        }
        if (!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)) {
            showFeedback('Invalid IBAN format.', 'error');
            return;
        }
        if (!validateIbanChecksum(iban)) {
            showFeedback('IBAN is not valid (checksum failed).', 'error');
            return;
        }

        showFeedback('IBAN is valid.', 'info');
        showResults(iban);
    };

    const showFeedback = (message, type) => {
        feedbackMessage.textContent = message;
        feedbackMessage.className = `feedback-message feedback-${type}`;
    };

    const hideResults = () => {
        resultContainer.style.display = 'none';
        ibanInfo.innerHTML = '';
        bankInfo.innerHTML = '';
    };

    const showResults = (iban) => {
        const countryCode = iban.slice(0, 2);
        let abiCode = 'N/A';
        let bankName = 'Bank information only available for Italian IBANs.';

        if (countryCode === 'IT') {
            abiCode = iban.slice(5, 10);
            bankName = bankDatabase[abiCode] || 'Italian bank not identified in this list.';
        }
        
        ibanInfo.innerHTML = `
            <p><strong>Country:</strong> ${countryCode}</p>
            <p><strong>Check Digits:</strong> ${iban.slice(2, 4)}</p>
            <p><strong>Length:</strong> ${iban.length} characters</p>
        `;
        bankInfo.innerHTML = `
            <p><strong>Bank Code (ABI):</strong> ${abiCode}</p>
            <p><strong>Bank Name:</strong> ${bankName}</p>
        `;
        resultContainer.style.display = 'block';
    };

    verifyButton.addEventListener('click', checkIban);
    ibanInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkIban();
    });
    ibanInput.addEventListener('input', () => {
        hideResults();
        showFeedback('', 'info');
    });

    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          document.querySelectorAll(selector).forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
});
</script>
