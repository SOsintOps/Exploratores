<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBAN • Exploratores</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">IBAN Verification & Parsing Tool</h1>
    <section class="search-instructions">
        <label for="ibanInput">Enter IBAN to verify:</label>
        <div class="input-button-line">
            <input type="text" id="ibanInput" class="input-field" placeholder="e.g., IT18N0503401633000000005226" autocomplete="off">
            <button type="button" id="verifyButton" class="button">Verify</button>
        </div>
        <div id="feedbackMessage" class="feedback-message"></div>
    </section>
    <div class="note">
        <strong>NOTE:</strong> This tool validates IBAN structure for multiple countries and identifies the bank for Italian IBANs. No data is sent to external services.
    </div>

    <div id="resultContainer" style="display: none;">
        <h2>Verification Results</h2>
        <div class="columns">
            <div class="column">
                <h3>IBAN Information</h3>
                <div id="ibanInfo"></div>
            </div>
            <div class="column">
                <h3>Bank Information</h3>
                <div id="bankInfo"></div>
            </div>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 2.5 • Prototype <a href="../license.html">License</a></p>
</footer>

<script src="../assets/menu/navigation.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/ibankit.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const ibanInput = document.getElementById('ibanInput');
    const verifyButton = document.getElementById('verifyButton');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const resultContainer = document.getElementById('resultContainer');
    const ibanInfo = document.getElementById('ibanInfo');
    const bankInfo = document.getElementById('bankInfo');

    const checkIban = () => {
        const iban = ibanInput.value.replace(/\s/g, '').toUpperCase();
        
        hideResults();
        if (!iban) {
            showFeedback('Please enter an IBAN.', 'error');
            return;
        }

        if (!ibankit.validateIBAN(iban)) {
            const countryCode = iban.substring(0, 2);
            const countryInfo = ibankit.IBAN_COUNTRIES[countryCode];
            let message = 'IBAN is not valid.';
            if (countryInfo && iban.length !== countryInfo.length) {
                message += ` Expected length for ${countryCode} is ${countryInfo.length}.`;
            } else {
                message += ' Checksum or format is incorrect.';
            }
            showFeedback(message, 'error');
            return;
        }

        showFeedback('IBAN is valid.', 'info');
        showResults(iban);
    };

    const showFeedback = (message, type) => {
        feedbackMessage.textContent = message;
        feedbackMessage.className = `feedback-message feedback-${type}`;
    };

    const hideResults = () => {
        resultContainer.style.display = 'none';
        ibanInfo.innerHTML = '';
        bankInfo.innerHTML = '';
    };

    const showResults = (iban) => {
        const countryCode = iban.substring(0, 2);
        
        ibanInfo.innerHTML = `
            <p><strong>Country:</strong> ${ibankit.getCountryName(countryCode)} (${countryCode})</p>
            <p><strong>Check Digits:</strong> ${iban.substring(2, 4)}</p>
            <p><strong>Length:</strong> ${iban.length} characters</p>
        `;

        let bankInfoHtml = '';
        if (countryCode === 'IT') {
            const cin = iban.substring(4, 5);
            const abi = iban.substring(5, 10);
            const cab = iban.substring(10, 15);
            const accountNumber = iban.substring(15);
            const bankName = (typeof bankDatabase !== 'undefined' && bankDatabase[abi])
                ? bankDatabase[abi]
                : 'Italian bank not identified in this list.';

            bankInfoHtml = `
                <p><strong>Bank Name:</strong> ${bankName}</p>
                <p><strong>Country:</strong> ${countryCode}</p>
                <p><strong>CIN EUR:</strong> ${iban.substring(2, 4)}</p>
                <p><strong>CIN:</strong> ${cin}</p>
                <p><strong>ABI:</strong> ${abi}</p>
                <p><strong>CAB:</strong> ${cab}</p>
                <p><strong>Account Number:</strong> ${accountNumber}</p>
            `;
        } else {
            const bankCode = 'N/A';
            const bankName = 'Bank name identification is available for Italian IBANs only.';
            bankInfoHtml = `
                <p><strong>Bank Identifier:</strong> ${bankCode}</p>
                <p><strong>Bank Name:</strong> ${bankName}</p>
            `;
        }
        
        bankInfo.innerHTML = bankInfoHtml;
        resultContainer.style.display = 'block';
    };

    verifyButton.addEventListener('click', checkIban);
    ibanInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkIban();
    });
    ibanInput.addEventListener('input', () => {
        hideResults();
        showFeedback('', 'info');
    });

    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          document.querySelectorAll(selector).forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
});
</script>

</body>
</html>
