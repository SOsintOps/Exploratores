<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBAN Toolkit • Exploratores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <h1 class="page-title">IBAN Toolkit</h1>

        <section class="search-instructions">
            <h2>Local IBAN Verifier</h2>
            <label for="ibanVerifyInput">Enter IBAN for local validation and parsing:</label>
            <div class="input-button-line">
                <input type="text" id="ibanVerifyInput" class="input-field" placeholder="e.g., IT60X054281110100000123456" autocomplete="off">
                <button type="button" id="verifyButton" class="button">Verify</button>
            </div>
            <div id="verifyFeedback" class="feedback-message"></div>
            
            <div id="verificationResult" class="results-box" style="display: none;">
                <div class="columns">
                    <div class="column" id="ibanInfoColumn"></div>
                    <div class="column" id="bankInfoColumn"></div>
                </div>
            </div>
        </section>

        <hr>

        <section class="search-instructions">
            <h2>External OSINT Search</h2>
            <label for="ibanSearchInput">Enter IBAN to search on external services:</label>
            <div class="input-container">
                <input type="text" id="ibanSearchInput" class="input-field" placeholder="IBAN..." autocomplete="off">
            </div>
            <div id="searchFeedback" class="feedback-message"></div>

            <div class="button-grid">
                <button id="btn-iban-google" type="button" class="button" data-search-id="iban-search-google">Google Search</button>
                <button id="btn-iban-swift" type="button" class="button" data-search-id="iban-search-swift">SWIFT Search</button>
                <button id="btn-iban-ibancom" type="button" class="button" data-search-id="iban-search-ibancom">IBAN.com</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Exploratores 2.6 <a href="license.html">License</a></p>
    </footer>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ibankit.js"></script>
    <script src="../assets/js/validators.js"></script>
    <script src="../assets/js/search-library.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/menu/navigation.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- LOGICA PER LA VERIFICA LOCALE ---
        const verifyInput = document.getElementById('ibanVerifyInput');
        const verifyButton = document.getElementById('verifyButton');
        const verifyFeedback = document.getElementById('verifyFeedback');
        const verificationResult = document.getElementById('verificationResult');
        const ibanInfoColumn = document.getElementById('ibanInfoColumn');
        const bankInfoColumn = document.getElementById('bankInfoColumn');

        const handleVerification = () => {
            const ibanRaw = verifyInput.value.trim();
            const iban = ibanRaw.replace(/\s/g, '').toUpperCase();
            
            verificationResult.style.display = 'none';
            ibanInfoColumn.innerHTML = '';
            bankInfoColumn.innerHTML = '';

            if (!iban) {
                verifyFeedback.textContent = 'Please enter an IBAN.';
                verifyFeedback.className = 'feedback-message feedback-error';
                return;
            }

            if (typeof ibankit !== 'undefined' && ibankit.validateIBAN(iban)) {
                verifyFeedback.textContent = 'IBAN structure and checksum are valid.';
                verifyFeedback.className = 'feedback-message feedback-info';

                const countryCode = iban.substring(0, 2);
                const countryInfo = ibankit.IBAN_COUNTRIES[countryCode];
                
                let ibanInfoHTML = `
                    <h3>IBAN Information</h3>
                    <p><strong>Country:</strong> ${countryInfo.name || 'Unknown'} (${countryCode})</p>
                    <p><strong>Check Digits:</strong> ${iban.substring(2, 4)}</p>
                    <p><strong>Length:</strong> ${iban.length} characters</p>
                `;
                
                let bankInfoHTML = `<h3>Bank Information</h3>`;

                // --- LOGICA DI PARSING DETTAGLIATA PER IBAN ITALIANI ---
                if (countryCode === 'IT') {
                    const cin = iban.substring(4, 5);
                    const abi = iban.substring(5, 10);
                    const cab = iban.substring(10, 15);
                    const accountNumber = iban.substring(15, 27);
                    const bankName = (typeof bankDatabase !== 'undefined' && bankDatabase[abi]) ? bankDatabase[abi] : 'Italian bank not found in local database.';

                    bankInfoHTML += `
                        <p><strong>Bank Name:</strong> ${bankName}</p>
                        <p><strong>CIN:</strong> ${cin}</p>
                        <p><strong>ABI:</strong> ${abi}</p>
                        <p><strong>CAB:</strong> ${cab}</p>
                        <p><strong>Account Number:</strong> ${accountNumber}</p>
                    `;
                } else {
                    bankInfoHTML += `<p>Detailed BBAN parsing is currently only supported for Italian IBANs.</p>`;
                }

                ibanInfoColumn.innerHTML = ibanInfoHTML;
                bankInfoColumn.innerHTML = bankInfoHTML;
                verificationResult.style.display = 'block';

            } else {
                verifyFeedback.textContent = 'Invalid IBAN format or checksum.';
                verifyFeedback.className = 'feedback-message feedback-error';
            }
        };

        verifyButton.addEventListener('click', handleVerification);
        verifyInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleVerification();
        });

        // --- LOGICA PER LE RICERCHE ESTERNE ---
        const searchInput = document.getElementById('ibanSearchInput');
        const searchFeedback = document.getElementById('searchFeedback');
        const searchButtons = document.querySelectorAll('[data-search-id^="iban-search-"]');

        const updateSearchUi = () => {
            const validationResult = ExploratoresValidators.getAndValidateIban({}, searchInput.value);
            
            searchButtons.forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (searchInput.value) {
                searchFeedback.textContent = validationResult.message;
                searchFeedback.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
            } else {
                searchFeedback.textContent = '';
            }
        };

        searchInput.addEventListener('input', updateSearchUi);
        updateSearchUi(); // Set initial state
    });
    </script>

</body>
</html>
