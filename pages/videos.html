<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer" />
  <title>Videos • Exploratores</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>
    
<main>
  <h1 class="page-title">Videos Tool</h1>
  <div class="note">
    <strong>NOTE:</strong> Some tools require a YOUR_API_KEY placeholder to be replaced with a valid Google API key.
  </div>

  <div class="columns">
    <div class="column" id="left-column">
      <section id="section-videos-id" class="search-instructions">
        <h2>YouTube Video ID Tools</h2>
        <label for="youtubeVideoIdInput">Enter YouTube Video ID:</label>
        <div class="input-container">
          <input type="text" id="youtubeVideoIdInput" class="input-field" placeholder="e.g., dQw4w9WgXcQ" autocomplete="off"/>
        </div>
        <div id="feedback-videos-id" class="feedback-message"></div>
        <div class="button-grid">
          <button type="button" class="button" data-search-id="videos-id-agebypass">Age Bypass</button>
          <button type="button" class="button" data-search-id="videos-id-archives">Archives (Video)</button>
          <button type="button" class="button" data-search-id="videos-id-bingreverse">Bing Reverse</button>
          <button type="button" class="button" data-search-id="videos-id-download">Download</button>
          <button type="button" class="button" data-search-id="videos-id-fullscreen">Full Screen</button>
          <button type="button" class="button" data-search-id="videos-id-googlereverse">Google Reverse</button>
          <button type="button" class="button" data-search-id="videos-id-metadata">Metadata (Video)</button>
          <button type="button" class="button" data-search-id="videos-id-restrictions1">Restrictions I</button>
          <button type="button" class="button" data-search-id="videos-id-restrictions2">Restrictions II</button>
          <button type="button" class="button" data-search-id="videos-id-thumb2">Thumbnail 2</button>
          <button type="button" class="button" data-search-id="videos-id-thumb3">Thumbnail 3</button>
          <button type="button" class="button" data-search-id="videos-id-thumb4">Thumbnail 4</button>
          <button type="button" class="button" data-search-id="videos-id-thumbhq">Thumbnail HQ</button>
          <button type="button" class="button" data-search-id="videos-id-tineye">TinEye Reverse</button>
          <button type="button" class="button" data-search-id="videos-id-yandex">Yandex Reverse</button>
        </div>
      </section>
      
      <section id="section-videos-comments" class="search-instructions">
        <h3>YouTube Comments Search</h3>
        <label for="ytVideoIdForComments">YouTube Video ID:</label>
        <input type="text" id="ytVideoIdForComments" class="input-field" placeholder="Video ID (or use from above)" autocomplete="off"/>
        <label for="ytCommentSearchTerm">Comment Search Term:</label>
        <div class="input-button-line">
          <input type="text" id="ytCommentSearchTerm" class="input-field" placeholder="Search term in comments" autocomplete="off"/>
          <button type="button" class="button" data-search-id="videos-comments-search">Search</button>
        </div>
        <div id="feedback-videos-comments" class="feedback-message"></div>
      </section>

      <section id="section-videos-channel" class="search-instructions">
        <h3>YouTube Channel & User Tools</h3>
        <label for="ytUsernameInput">YouTube Username:</label>
        <div class="input-button-line">
            <input type="text" id="ytUsernameInput" class="input-field" placeholder="Username" autocomplete="off"/>
            <button type="button" class="button" data-search-id="videos-channel-account">Account</button>
            <button type="button" class="button" data-search-id="videos-channel-profile">Profile</button>
        </div>
        <div id="feedback-videos-username" class="feedback-message"></div>
        <hr>
        <label for="ytChannelIdInput">YouTube Channel ID:</label>
        <div class="input-button-line">
            <input type="text" id="ytChannelIdInput" class="input-field" placeholder="Channel ID" autocomplete="off"/>
            <button type="button" class="button" data-search-id="videos-channel-metadata">Metadata</button>
        </div>
        <div id="feedback-videos-channelid" class="feedback-message"></div>
      </section>
    </div>

    <div class="column" id="right-column">
      <section id="section-videos-term" class="search-instructions">
        <h2>Video Search by Terms</h2>
        <label for="videoSearchTermsInput">Enter keywords for video search:</label>
        <div class="input-container">
          <input type="text" id="videoSearchTermsInput" class="input-field" placeholder="Keywords..." autocomplete="off"/>
        </div>
        <div id="feedback-videos-term" class="feedback-message"></div>
        <div class="button-grid">
          <button type="button" class="button" data-search-id="videos-term-archives-movies">Archives I (Movies)</button>
          <button type="button" class="button" data-search-id="videos-term-archives-opensource">Archives II (OpenSource)</button>
          <button type="button" class="button" data-search-id="videos-term-bing">Bing Videos</button>
          <button type="button" class="button" data-search-id="videos-term-facebook">Facebook Videos</button>
          <button type="button" class="button" data-search-id="videos-term-google">Google Videos</button>
          <button type="button" class="button" data-search-id="videos-term-reddit">Reddit Videos</button>
          <button type="button" class="button" data-search-id="videos-term-tvarchives">TV Archives</button>
          <button type="button" class="button" data-search-id="videos-term-twitter">Twitter Videos</button>
          <button type="button" class="button" data-search-id="videos-term-yandex">Yandex Videos</button>
          <button type="button" class="button" data-search-id="videos-term-youtube">YouTube Videos</button>
        </div>
      </section>

      <section id="section-videos-tiktok" class="search-instructions">
        <h3>TikTok Search</h3>
        <label for="tikTokHashtagInput">TikTok Hashtag:</label>
        <div class="input-button-line">
          <input type="text" id="tikTokHashtagInput" class="input-field" placeholder="Hashtag (without #)" autocomplete="off"/>
          <button type="button" class="button" data-search-id="videos-tiktok-hashtag">Search</button>
        </div>
        <div id="feedback-videos-tiktok" class="feedback-message"></div>
      </section>
      
      <section id="section-videos-reverse-other" class="search-instructions">
        <h2>Video Thumbnail &amp; Image Reverse Search</h2>
        <label for="vimeoImgUrlInput">Vimeo Image URL:</label>
        <div class="input-container">
            <input type="text" id="vimeoImgUrlInput" class="input-field" placeholder="Vimeo Image URL" autocomplete="off"/>
        </div>
        <div id="feedback-videos-vimeo" class="feedback-message"></div>
        <div class="button-grid">
            <button type="button" class="button" data-search-id="videos-reverse-vimeo-google">Google</button>
            <button type="button" class="button" data-search-id="videos-reverse-vimeo-tineye">TinEye</button>
            <button type="button" class="button" data-search-id="videos-reverse-vimeo-yandex">Yandex</button>
            <button type="button" class="button" data-search-id="videos-reverse-vimeo-bing">Bing</button>
        </div>
        <hr>
        <label for="reverseImageUrlInput">General Image URL:</label>
        <div class="input-container">
            <input type="text" id="reverseImageUrlInput" class="input-field" placeholder="Image URL" autocomplete="off"/>
        </div>
        <div id="feedback-videos-general-url" class="feedback-message"></div>
        <div class="button-grid">
            <button type="button" class="button" data-search-id="videos-reverse-img-google">Google</button>
            <button type="button" class="button" data-search-id="videos-reverse-img-bing">Bing</button>
            <button type="button" class="button" data-search-id="videos-reverse-img-tineye">TinEye</button>
            <button type="button" class="button" data-search-id="videos-reverse-img-yandex">Yandex</button>
            <button type="button" class="button" data-search-id="videos-reverse-img-baidu">Baidu</button>
        </div>
      </section>
    </div>
  </div>
</main>

<footer>
  <p>Exploratores 3.5.0 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            { inputIds: ['youtubeVideoIdInput'], buttonSelector: '#section-videos-id .button', validator: ExploratoresValidators.getAndValidateYoutubeId, feedbackId: 'feedback-videos-id' },
            { inputIds: ['ytVideoIdForComments', 'ytCommentSearchTerm'], buttonSelector: '#section-videos-comments .button', validator: ExploratoresValidators.getAndValidateYoutubeComments, feedbackId: 'feedback-videos-comments' },
            { inputIds: ['ytUsernameInput'], buttonSelector: '#section-videos-channel .input-button-line:nth-of-type(1) .button', validator: ExploratoresValidators.getAndValidateYoutubeUsername, feedbackId: 'feedback-videos-username' },
            { inputIds: ['ytChannelIdInput'], buttonSelector: '#section-videos-channel .input-button-line:nth-of-type(2) .button', validator: ExploratoresValidators.getAndValidateYoutubeChannelId, feedbackId: 'feedback-videos-channelid' },
            { inputIds: ['videoSearchTermsInput'], buttonSelector: '#section-videos-term .button', validator: ExploratoresValidators.getAndValidateVideoTerm, feedbackId: 'feedback-videos-term' },
            { inputIds: ['tikTokHashtagInput'], buttonSelector: '#section-videos-tiktok .button', validator: ExploratoresValidators.getAndValidateTikTokHashtag, feedbackId: 'feedback-videos-tiktok' },
            { inputIds: ['vimeoImgUrlInput'], buttonSelector: '#section-videos-reverse-other .button-grid:nth-of-type(1) .button', validator: ExploratoresValidators.getAndValidateVimeoImageUrl, feedbackId: 'feedback-videos-vimeo' },
            { inputIds: ['reverseImageUrlInput'], buttonSelector: '#section-videos-reverse-other .button-grid:nth-of-type(2) .button', validator: ExploratoresValidators.getAndValidateImageUrl, feedbackId: 'feedback-videos-general-url' }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);
            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });
            if (feedbackEl) {
                const inputValue = group.inputIds.map(id => document.getElementById(id)?.value.trim()).join('');
                if (!inputValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
