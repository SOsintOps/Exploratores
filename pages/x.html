<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X (Twitter) • Exploratores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">X (Twitter) Tools</h1>

    <div class="columns">
        <div id="column-x-left" class="column">
            <section id="section-x-account" class="search-instructions">
                <h2>Account & Basic Searches</h2>
                <label for="input-x-account-username">X (Twitter) Username (without @)</label>
                <div class="input-container">
                    <input type="text" id="input-x-account-username" class="input-field" placeholder="Enter username..." autocomplete="off">
                </div>
                <div id="feedback-x-account-username" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-x-account-profile" class="button" data-search-id="x-account-profile">Profile</button>
                    <button id="btn-x-account-outgoing" class="button" data-search-id="x-account-outgoing">Outgoing Mentions</button>
                    <button id="btn-x-account-incoming" class="button" data-search-id="x-account-incoming">Incoming Mentions</button>
                    <button id="btn-x-account-only-replies" class="button" data-search-id="x-account-only-replies">Only Replies</button>
                    <button id="btn-x-account-no-replies" class="button" data-search-id="x-account-no-replies">No Replies</button>
                    <button id="btn-x-account-media" class="button" data-search-id="x-account-media">Media</button>
                    <button id="btn-x-account-highlights" class="button" data-search-id="x-account-highlights">Highlights</button>
                    <button id="btn-x-account-lists-created" class="button" data-search-id="x-account-lists-created">Lists Created</button>
                    <button id="btn-x-account-lists-included" class="button" data-search-id="x-account-lists-included">Lists Included</button>
                    <button id="btn-x-account-topics" class="button" data-search-id="x-account-topics">Topics</button>
                    <button id="btn-x-account-links" class="button" data-search-id="x-account-links">Links</button>
                    <button id="btn-x-account-followers" class="button" data-search-id="x-account-followers">Followers</button>
                    <button id="btn-x-account-following" class="button" data-search-id="x-account-following">Following</button>
                </div>
            </section>

            <section id="section-x-lists" class="search-instructions">
                <h2>Lists</h2>
                <label for="input-x-listId">List ID (numeric)</label>
                <div class="input-container">
                    <input type="text" id="input-x-listId" class="input-field" placeholder="Enter numeric list ID..." autocomplete="off">
                </div>
                <div id="feedback-x-listId" class="feedback-message"></div>
                <div class="button-grid button-grid-3col">
                    <button id="btn-x-list-view" class="button" data-search-id="x-list-view">List</button>
                    <button id="btn-x-list-members" class="button" data-search-id="x-list-members">Members</button>
                    <button id="btn-x-list-followers" class="button" data-search-id="x-list-followers">Followers</button>
                </div>
            </section>

            <section id="section-x-other" class="search-instructions">
                <h2>Other Searches</h2>
                <label for="input-x-realName">Real Name</label>
                <div class="input-container">
                    <input type="text" id="input-x-realName" class="input-field" placeholder="Enter a real name..." autocomplete="off">
                </div>
                <div id="feedback-x-realName" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-x-other-profilename" class="button" data-search-id="x-other-profilename">Profile Search</button>
                </div>
            </section>
        </div>

        <div id="column-x-right" class="column">
            <section id="section-x-by-year" class="search-instructions">
                <h2>By Year (User or Term)</h2>
                <div class="input-container">
                    <input type="text" id="input-x-yearTerm" class="input-field" placeholder="Username or keyword..." autocomplete="off">
                    <input type="text" id="input-x-yearNum" class="input-field" placeholder="Year (YYYY)..." autocomplete="off">
                </div>
                <div id="feedback-x-by-year" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-x-year-outgoing" class="button" data-search-id="x-year-outgoing">Outgoing</button>
                    <button id="btn-x-year-incoming" class="button" data-search-id="x-year-incoming">Incoming</button>
                    <button id="btn-x-year-media" class="button" data-search-id="x-year-media">Media</button>
                    <button id="btn-x-year-term" class="button" data-search-id="x-year-term">Term</button>
                    <button id="btn-x-year-no-replies" class="button" data-search-id="x-year-no-replies">No Replies</button>
                    <button id="btn-x-year-only-replies" class="button" data-search-id="x-year-only-replies">Only Replies</button>
                </div>
            </section>

            <section id="section-x-archives" class="search-instructions">
                <h2>Web Archives & Cache Services</h2>
                <label for="input-x-archiveUser">X Username (without @)</label>
                <div class="input-container">
                    <input type="text" id="input-x-archiveUser" class="input-field" placeholder="Enter username..." autocomplete="off">
                </div>
                <div id="feedback-x-archiveUser" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-x-archive-google-site" class="button" data-search-id="x-archive-google-site">Google Archives</button>
                    <button id="btn-x-archive-google-tweets" class="button" data-search-id="x-archive-google-tweets">Google Tweets</button>
                    <button id="btn-x-archive-bing" class="button" data-search-id="x-archive-bing">Bing Archives</button>
                    <button id="btn-x-archive-yandex" class="button" data-search-id="x-archive-yandex">Yandex Archives</button>
                    <button id="btn-x-archive-wayback" class="button" data-search-id="x-archive-wayback">Wayback</button>
                    <button id="btn-x-archive-memorylol" class="button" data-search-id="x-archive-memorylol">Memory.lol</button>
                    <button id="btn-x-archive-audit" class="button" data-search-id="x-archive-audit">TwitterAudit</button>
                </div>
                 <hr>
                <label for="input-x-memoryId">X User ID (numeric)</label>
                <div class="input-container">
                     <input type="text" id="input-x-memoryId" class="input-field" placeholder="Enter numeric user ID..." autocomplete="off">
                </div>
                <div id="feedback-x-memoryId" class="feedback-message"></div>
                <div class="button-grid">
                     <button id="btn-x-archive-memorylol-id" class="button" data-search-id="x-archive-memorylol-id">Memory.lol ID</button>
                </div>
            </section>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 3.2.0 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['input-x-account-username'],
                buttonSelector: '#section-x-account .button',
                validator: ExploratoresValidators.getAndValidateXAccountUsername,
                feedbackId: 'feedback-x-account-username'
            },
            {
                inputIds: ['input-x-listId'],
                buttonSelector: '#section-x-lists .button',
                validator: ExploratoresValidators.getAndValidateXListId,
                feedbackId: 'feedback-x-listId'
            },
            {
                inputIds: ['input-x-realName'],
                buttonSelector: '#section-x-other .button',
                validator: ExploratoresValidators.getAndValidateXRealName,
                feedbackId: 'feedback-x-realName'
            },
            {
                inputIds: ['input-x-yearTerm', 'input-x-yearNum'],
                buttonSelector: '#section-x-by-year .button',
                validator: ExploratoresValidators.getAndValidateXYearSearch,
                feedbackId: 'feedback-x-by-year'
            },
            {
                inputIds: ['input-x-archiveUser'],
                buttonSelector: '#feedback-x-archiveUser + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateXArchiveUser,
                feedbackId: 'feedback-x-archiveUser'
            },
            {
                inputIds: ['input-x-memoryId'],
                buttonSelector: '#feedback-x-memoryId + .button-grid .button',
                validator: ExploratoresValidators.getAndValidateXMemoryId,
                feedbackId: 'feedback-x-memoryId'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const anyInputWithValue = group.inputIds.some(id => document.getElementById(id)?.value.trim() !== '');
                if (!anyInputWithValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
