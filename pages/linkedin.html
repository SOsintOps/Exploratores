<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Tools • Exploratores</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/roman-helmet.ico">
</head>
<body>

<div id="navbar-placeholder"></div>

<main>
    <h1 class="page-title">LinkedIn Tools</h1>
    <div class="note">
        An active LinkedIn investigative profile is required to use these features.
    </div>

    <div class="columns">
        <div class="column">
            <section id="section-linkedin-profile" class="search-instructions">
                <h2>Profile</h2>
                <label for="input-linkedin-profile-user">Username (Profile Path):</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-profile-user" class="input-field" placeholder="e.g., johndoe or pub/johndoe/12/345/678" autocomplete="off">
                </div>
                <div id="feedback-linkedin-profile" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-linkedin-profile" class="button" data-search-id="linkedin-profile">Profile</button>
                </div>
            </section>

            <section id="section-linkedin-media" class="search-instructions">
                <h2>Media Search</h2>
                <label for="input-linkedin-media-keyword">Image Search (Name/Keyword):</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-media-keyword" class="input-field" placeholder="Username or real name" autocomplete="off">
                </div>
                <div id="feedback-linkedin-media" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-linkedin-images-google" class="button" data-search-id="linkedin-images-google">Google Images</button>
                    <button id="btn-linkedin-images-bing" class="button" data-search-id="linkedin-images-bing">Bing Images</button>
                </div>
                <hr>
                <label for="input-linkedin-video-keyword">Video Search (Keyword):</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-video-keyword" class="input-field" placeholder="Search term for videos" autocomplete="off">
                </div>
                 <div id="feedback-linkedin-video" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-linkedin-video-search" class="button" data-search-id="linkedin-video-search">Video Search</button>
                </div>
            </section>

            <section id="section-linkedin-timestamp" class="search-instructions">
                <h2>Timestamp Decoder</h2>
                <label for="input-linkedin-timestamp-url">Post URL or URN:</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-timestamp-url" class="input-field" placeholder="LinkedIn Post URL or URN (e.g., urn:li:activity:...)" autocomplete="off">
                </div>
                <div class="button-grid">
                    <button id="btn-linkedin-timestamp-decode" class="button">Decode Timestamp</button>
                </div>
                <div class="input-container" style="margin-top:0.5rem;">
                    <strong style="margin-right: 0.5rem;">Decoded Date (UTC):</strong><span id="span-linkedin-timestamp-result"></span>
                </div>
            </section>

        </div>

        <div class="column">
            <section id="section-linkedin-cgs" class="search-instructions">
                <h2>Company, Group, School & Events</h2>
                <label for="input-linkedin-cgs-keyword">Keyword:</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-cgs-keyword" class="input-field" placeholder="Enter a keyword..." autocomplete="off">
                </div>
                <div id="feedback-linkedin-cgs" class="feedback-message"></div>
                <div class="button-grid">
                    <button id="btn-linkedin-search-companies" class="button" data-search-id="linkedin-search-companies">Companies</button>
                    <button id="btn-linkedin-search-groups" class="button" data-search-id="linkedin-search-groups">Groups</button>
                    <button id="btn-linkedin-search-schools" class="button" data-search-id="linkedin-search-schools">Schools</button>
                    <button id="btn-linkedin-search-events" class="button" data-search-id="linkedin-search-events">Events</button>
                </div>
            </section>

            <section id="section-linkedin-external" class="search-instructions">
                <h2>External Engine Searches</h2>
                <label>Keywords & Names:</label>
                <div class="input-container">
                    <input type="text" id="input-linkedin-ext-keyword" class="input-field" placeholder="Keyword" autocomplete="off">
                    <input type="text" id="input-linkedin-ext-fname" class="input-field" placeholder="First Name" autocomplete="off">
                    <input type="text" id="input-linkedin-ext-lname" class="input-field" placeholder="Last Name" autocomplete="off">
                    <input type="text" id="input-linkedin-ext-title" class="input-field" placeholder="Title" autocomplete="off">
                    <input type="text" id="input-linkedin-ext-company" class="input-field" placeholder="Company" autocomplete="off">
                    <input type="text" id="input-linkedin-ext-school" class="input-field" placeholder="School" autocomplete="off">
                </div>
                <div id="feedback-linkedin-external" class="feedback-message"></div>
                <div class="button-grid button-grid-3col">
                    <button id="btn-linkedin-ext-google" class="button" data-search-id="linkedin-ext-google">Google People</button>
                    <button id="btn-linkedin-ext-bing" class="button" data-search-id="linkedin-ext-bing">Bing People</button>
                    <button id="btn-linkedin-ext-yandex" class="button" data-search-id="linkedin-ext-yandex">Yandex People</button>
                </div>
            </section>
        </div>
    </div>
</main>

<footer>
    <p>Exploratores 3.4.1 <a href="./license.html">License</a></p>
</footer>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/validators.js"></script>
<script src="../assets/js/search-library.js"></script>
<script src="../assets/menu/navigation.js"></script>

<script>
    // --- Timestamp Decoder Logic ---
    function setupTimestampDecoder() {
        const decodeButton = document.getElementById('btn-linkedin-timestamp-decode');
        const urlInput = document.getElementById('input-linkedin-timestamp-url');
        const resultSpan = document.getElementById('span-linkedin-timestamp-result');

        const getPostIdFromUrlOrUrn = (urlOrUrnStr) => {
            const patterns = [
                /urn:li:(?:activity|comment|share|article|document):([0-9]{19})/,
                /linkedin\.com\/feed\/update\/urn:li:(?:activity|share):([0-9]{19})/,
                /linkedin\.com\/posts\/.*activity-([0-9]{19})-/,
                /linkedin\.com\/pulse\/[^/]+\/.*-([0-9]{19})(?:-\w+)?\/?$/,
                /^([0-9]{19})$/
            ];
            for (const pattern of patterns) {
                const match = urlOrUrnStr.match(pattern);
                if (match && match[1]) return match[1];
            }
            return null;
        };

        const extractUnixTimestamp = (linkedinId) => {
            if (!linkedinId || linkedinId.length !== 19) return null;
            try {
                const binaryRepresentation = BigInt(linkedinId).toString(2).padStart(63, '0');
                const timestampBinary = binaryRepresentation.substring(0, 41);
                return parseInt(timestampBinary, 2);
            } catch (e) {
                return null;
            }
        };

        const unixTimestampToHumanDate = (unixTimestamp) => {
            if (unixTimestamp === null || typeof unixTimestamp === 'undefined') return 'Invalid ID or URN.';
            const date = new Date(unixTimestamp);
            if (isNaN(date.getTime())) return 'Invalid date derived from timestamp.';
            return date.toUTCString();
        };
        
        urlInput.addEventListener('input', () => {
            decodeButton.disabled = urlInput.value.trim() === '';
            decodeButton.classList.toggle('text-active', urlInput.value.trim() !== '');
        });

        decodeButton.addEventListener('click', () => {
            const urlOrUrn = urlInput.value.trim();
            if (!urlOrUrn) {
                resultSpan.textContent = 'Please enter a URL or URN.';
                return;
            }
            const postId = getPostIdFromUrlOrUrn(urlOrUrn);
            if (!postId) {
                resultSpan.textContent = 'Could not extract a valid LinkedIn ID/URN.';
                return;
            }
            const unixTs = extractUnixTimestamp(postId);
            resultSpan.textContent = unixTimestampToHumanDate(unixTs);
        });
        
        decodeButton.disabled = true; // Initial state
    }


    // --- Input Groups for Search UI ---
    function setInitialPageState() {
        const inputGroups = [
            {
                inputIds: ['input-linkedin-profile-user'],
                buttonSelector: '#section-linkedin-profile .button',
                validator: ExploratoresValidators.getAndValidateLinkedinProfile,
                feedbackId: 'feedback-linkedin-profile'
            },
            {
                inputIds: ['input-linkedin-media-keyword'],
                buttonSelector: '#section-linkedin-media .button-grid:nth-of-type(1) .button',
                validator: ExploratoresValidators.getAndValidateLinkedinMedia,
                feedbackId: 'feedback-linkedin-media'
            },
            {
                inputIds: ['input-linkedin-video-keyword'],
                buttonSelector: '#section-linkedin-media .button-grid:nth-of-type(2) .button',
                validator: ExploratoresValidators.getAndValidateLinkedinVideo,
                feedbackId: 'feedback-linkedin-video'
            },
            {
                inputIds: ['input-linkedin-cgs-keyword'],
                buttonSelector: '#section-linkedin-cgs .button',
                validator: ExploratoresValidators.getAndValidateLinkedinKeyword,
                feedbackId: 'feedback-linkedin-cgs'
            },
            {
                inputIds: ['input-linkedin-ext-keyword', 'input-linkedin-ext-fname', 'input-linkedin-ext-lname', 'input-linkedin-ext-title', 'input-linkedin-ext-company', 'input-linkedin-ext-school'],
                buttonSelector: '#section-linkedin-external .button',
                validator: ExploratoresValidators.getAndValidateLinkedinExternal,
                feedbackId: 'feedback-linkedin-external'
            }
        ];

        const updateUi = (group) => {
            const validationResult = group.validator();
            const feedbackEl = document.getElementById(group.feedbackId);

            document.querySelectorAll(group.buttonSelector).forEach(button => {
                button.disabled = !validationResult.isValid;
                button.classList.toggle('text-active', validationResult.isValid);
            });

            if (feedbackEl) {
                const anyInputWithValue = group.inputIds.some(id => document.getElementById(id)?.value.trim() !== '');
                if (!anyInputWithValue) {
                    feedbackEl.textContent = '';
                } else {
                    feedbackEl.textContent = validationResult.message;
                    feedbackEl.className = `feedback-message ${validationResult.isValid ? 'feedback-info' : 'feedback-error'}`;
                }
            }
        };

        inputGroups.forEach(group => {
            group.inputIds.forEach(inputId => {
                const inputElement = document.getElementById(inputId);
                if (inputElement) inputElement.addEventListener('input', () => updateUi(group));
            });
            updateUi(group);
        });
        
        setupTimestampDecoder();
    }

    document.addEventListener('DOMContentLoaded', setInitialPageState);
</script>

<script src="../assets/js/config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof exploratoresConfig !== 'undefined' && exploratoresConfig.lightVersionEnabled) {
      exploratoresConfig.selectorsToHide.forEach(selector => {
        try {
          const elements = document.querySelectorAll(selector);
          elements.forEach(el => el.classList.add('hidden-in-light'));
        } catch (e) {
          console.error("Invalid selector in config.js:", selector);
        }
      });
    }
  });
</script>

</body>
</html>
