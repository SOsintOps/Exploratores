name: Weekly link check

on:
  schedule:
    - cron: '13 13 * * 0'   # Sunday 13:13 UTC — spread load away from the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract URL targets from the search catalogue
        run: node scripts/linkcheck/extract-urls.mjs

      - name: Restore failure history from the previous run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'linkcheck.yml', status: 'success', per_page: 5 });
            const prev = runs.data.workflow_runs.find(r => r.id !== context.runId);
            if (!prev) return core.info('No previous successful run — starting with a fresh history.');
            const arts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: prev.id });
            const art = arts.data.artifacts.find(a => a.name === 'linkcheck-results' && !a.expired);
            if (!art) return core.info(`Previous run ${prev.id} has no results artifact.`);
            const dl = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: art.id, archive_format: 'zip' });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/prev-results.zip`, Buffer.from(dl.data));
            core.info(`Downloaded artifact of run ${prev.id} (${prev.created_at})`);

      - name: Unpack previous history
        run: |
          if [ -f "$RUNNER_TEMP/prev-results.zip" ]; then
            unzip -o "$RUNNER_TEMP/prev-results.zip" -d "$RUNNER_TEMP/prev-results"
            for f in history results targets; do
              cp "$RUNNER_TEMP/prev-results/$f.json" "scripts/linkcheck/out/previous-$f.json" 2>/dev/null || true
            done
            for f in runs issues; do
              cp "$RUNNER_TEMP/prev-results/$f.csv" "scripts/linkcheck/out/$f.csv" 2>/dev/null || true
            done
          fi

      - name: Probe host liveness
        run: node scripts/linkcheck/check.mjs

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-results
          path: scripts/linkcheck/out/
          retention-days: 90

      - name: Create or update the dead-links issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scripts/linkcheck/out/report.md', 'utf8');
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: 'dead-links', state: 'open' });
            if (open.length) {
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
              core.info(`Updated issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ owner, repo, title: 'Weekly link-check report', labels: ['dead-links'], body });
              core.info(`Created issue #${created.number}`);
            }
