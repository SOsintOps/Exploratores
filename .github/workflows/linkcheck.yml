name: Weekly link check

on:
  schedule:
    - cron: '13 13 * * 0'   # Sunday 13:13 UTC — spread load away from the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write        # push the auto/disable-dead-links branch
  pull-requests: write   # open or update the automated pull request
  issues: write
  actions: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract URL targets from the search catalogue
        run: node scripts/linkcheck/extract-urls.mjs

      - name: Restore failure history from the previous run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'linkcheck.yml', status: 'success', per_page: 5 });
            const prev = runs.data.workflow_runs.find(r => r.id !== context.runId);
            if (!prev) return core.info('No previous successful run — starting with a fresh history.');
            const arts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: prev.id });
            const art = arts.data.artifacts.find(a => a.name === 'linkcheck-results' && !a.expired);
            if (!art) return core.info(`Previous run ${prev.id} has no results artifact.`);
            const dl = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: art.id, archive_format: 'zip' });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/prev-results.zip`, Buffer.from(dl.data));
            core.info(`Downloaded artifact of run ${prev.id} (${prev.created_at})`);

      - name: Unpack previous history
        run: |
          if [ -f "$RUNNER_TEMP/prev-results.zip" ]; then
            unzip -o "$RUNNER_TEMP/prev-results.zip" -d "$RUNNER_TEMP/prev-results"
            for f in history results targets; do
              cp "$RUNNER_TEMP/prev-results/$f.json" "scripts/linkcheck/out/previous-$f.json" 2>/dev/null || true
            done
            for f in runs issues; do
              cp "$RUNNER_TEMP/prev-results/$f.csv" "scripts/linkcheck/out/$f.csv" 2>/dev/null || true
            done
          fi

      - name: Probe host liveness
        run: node scripts/linkcheck/check.mjs

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-results
          path: scripts/linkcheck/out/
          retention-days: 90

      # Close the loop: entries on confirmed-dead hosts get "disabled" in the
      # catalogue and the export is rebuilt. Nothing lands on v3 by itself —
      # the change goes out as a pull request that a human merges.
      - name: Apply confirmed failures to the catalogue
        run: |
          node scripts/linkcheck/apply-history.mjs
          node scripts/catalogue/build-meta.mjs
          [ -f scripts/linkcheck/out/pr-body.md ] || echo 'Automated update from the weekly link check: catalogue export rebuilt, no entry changed.' > scripts/linkcheck/out/pr-body.md

      - name: Open or update the dead-links pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: v3
          branch: auto/disable-dead-links
          delete-branch: true
          add-paths: |
            assets/js/search-library.js
            assets/data/
          commit-message: "chore(linkcheck): mark tools on confirmed-dead hosts as disabled"
          title: "Automated dead-link update"
          body-path: scripts/linkcheck/out/pr-body.md
          labels: dead-links

      - name: Create or update the dead-links issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scripts/linkcheck/out/report.md', 'utf8');
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: 'dead-links', state: 'open' });
            let issue_number;
            if (open.length) {
              issue_number = open[0].number;
              await github.rest.issues.update({ owner, repo, issue_number, body });
              core.info(`Updated issue #${issue_number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ owner, repo, title: 'Weekly link-check report', labels: ['dead-links'], body });
              issue_number = created.number;
              core.info(`Created issue #${issue_number}`);
            }
            // Body edits are silent on GitHub — post a comment so subscribers get
            // notified whenever a run finds actionable problems.
            const history = JSON.parse(fs.readFileSync('scripts/linkcheck/out/history.json', 'utf8'));
            const ACTIONABLE = ['DNS_FAIL', 'GONE', 'SERVER_ERR', 'TLS_ERR'];
            const act = Object.entries(history).filter(([, h]) => ACTIONABLE.includes(h.class));
            if (act.length) {
              const confirmed = act.filter(([, h]) => h.strikes >= 2).map(([host]) => host);
              const observed = act.length - confirmed.length;
              const list = confirmed.slice(0, 10).map(h => `\`${h}\``).join(', ') + (confirmed.length > 10 ? ', …' : '');
              const comment = `Run of ${new Date().toISOString().slice(0, 10)}: ` +
                `**${confirmed.length} confirmed dead/unreliable host${confirmed.length === 1 ? '' : 's'}**` +
                (confirmed.length ? ` (${list})` : '') +
                `, ${observed} in observation. Full report in the issue body above.`;
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
              core.info('Notification comment posted.');
            } else {
              core.info('No actionable problems — no comment posted.');
            }
