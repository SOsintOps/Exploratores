name: Tests

on:
  push:
    branches: [v3]
  pull_request:

permissions:
  contents: read

jobs:
  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the validators test suite
        run: node tests/validators.test.js

      - name: Run the link-checker and catalogue-export tests
        run: node tests/linkcheck.test.mjs

      - name: Run the catalogue-updater tests
        run: node tests/catalogue-updater.test.mjs

      - name: Check that the catalogue export is up to date
        run: node scripts/catalogue/verify-meta.mjs
